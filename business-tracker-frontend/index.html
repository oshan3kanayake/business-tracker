<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Enterprise Gateway | Secure Corporate Authentication
    </title>

    <!-- Corporate Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --palette-ice: #dfe5f3;
            --palette-sage: #557373;
            --palette-shadow: #272401;
            --palette-cream: #f2efea;
            --palette-obsidian: #0d0d0d;
            --palette-error: #ff6b6b;
            --font-main: "Plus Jakarta Sans", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background-color: var(--palette-obsidian);
            color: var(--palette-cream);
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 30px 15px;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .corporate-grid-matrix {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(
                    rgba(85, 115, 115, 0.015) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(85, 115, 115, 0.015) 1px,
                    transparent 1px
                );
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .business-auth-wrapper {
            position: relative;
            z-index: 2;
            width: clamp(340px, 92vw, 450px);
            background: rgba(13, 13, 13, 0.82);
            border: 1px solid rgba(85, 115, 115, 0.25);
            padding: 48px 45px;
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.8),
                0 0 80px rgba(39, 36, 1, 0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: border-color 0.4s ease;
            backdrop-filter: blur(8px);
        }

        .business-auth-wrapper:hover {
            border-color: rgba(85, 115, 115, 0.4);
        }

        .brand-header {
            margin-bottom: 34px;
            text-align: left;
        }

        .brand-header h1 {
            margin-bottom: 6px;
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-header p {
            color: var(--palette-sage);
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.2px;
            line-height: 1.5;
        }

        .form-block {
            position: relative;
            width: 100%;
            margin-bottom: 24px;
        }

        .form-block label {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: var(--palette-sage);
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .business-input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(13, 13, 13, 0.7);
            border: 1px solid rgba(85, 115, 115, 0.3);
            color: var(--palette-cream);
            font-size: 0.95rem;
            font-weight: 400;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .business-input:focus {
            border-color: var(--palette-ice);
            background: rgba(13, 13, 13, 0.95);
            box-shadow: 0 0 20px rgba(223, 229, 243, 0.04);
        }

        .business-input:focus ~ label,
        .business-input:not(:placeholder-shown) ~ label {
            top: 0;
            left: 15px;
            padding: 0 6px;
            background-color: var(--palette-obsidian);
            color: var(--palette-ice);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .role-select {
            appearance: none;
            cursor: pointer;
            padding-right: 48px;
            background-image:
                linear-gradient(
                    45deg,
                    transparent 50%,
                    var(--palette-sage) 50%
                ),
                linear-gradient(
                    135deg,
                    var(--palette-sage) 50%,
                    transparent 50%
                );
            background-position:
                calc(100% - 22px) calc(50% - 3px),
                calc(100% - 16px) calc(50% - 3px);
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
        }

        .role-select option {
            background: var(--palette-obsidian);
            color: var(--palette-cream);
        }

        .form-block .select-label {
            top: 0;
            left: 15px;
            transform: none;
            padding: 0 6px;
            background-color: var(--palette-obsidian);
            color: var(--palette-ice);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .access-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: -5px;
            margin-bottom: 30px;
            font-size: 0.8rem;
        }

        .persistence-node {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--palette-sage);
            font-weight: 400;
            cursor: pointer;
        }

        .persistence-node input {
            width: 15px;
            height: 15px;
            accent-color: var(--palette-sage);
            cursor: pointer;
        }

        .recovery-anchor {
            color: var(--palette-sage);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .recovery-anchor:hover {
            color: var(--palette-ice);
        }

        .error-message {
            display: none;
            margin-top: 10px;
            margin-bottom: 15px;
            color: var(--palette-error);
            font-size: 0.85rem;
            line-height: 1.5;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        .login-submit-button {
            width: 100%;
            padding: 18px;
            background-color: var(--palette-sage);
            border: 1px solid rgba(223, 229, 243, 0.15);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-submit-button:hover:not(:disabled) {
            background-color: var(--palette-ice);
            color: var(--palette-obsidian);
            box-shadow: 0 10px 25px rgba(223, 229, 243, 0.15);
            transform: translateY(-2px);
        }

        .login-submit-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .registration-footer {
            margin-top: 28px;
            color: var(--palette-sage);
            font-size: 0.85rem;
            font-weight: 400;
            text-align: center;
        }

        .registration-footer a {
            margin-left: 5px;
            color: var(--palette-ice);
            border-bottom: 1px solid transparent;
            text-decoration: none;
            font-weight: 600;
            transition:
                border-color 0.2s ease,
                color 0.2s ease;
        }

        .registration-footer a:hover {
            color: #ffffff;
            border-color: #ffffff;
        }

        .is-hidden {
            display: none !important;
        }

        @media (max-width: 520px) {
            body {
                padding: 20px 12px;
            }

            .business-auth-wrapper {
                padding: 38px 26px;
            }

            .access-options {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="corporate-grid-matrix"></div>

    <div id="canvas-container"></div>

    <main
        class="business-auth-wrapper"
        id="auth-box"
    >
        <div class="brand-header">
            <h1>Corporate Gateway</h1>

            <p id="login-instructions">
                Enter your manager credentials below
            </p>
        </div>

        <form
            autocomplete="off"
            id="login-form"
            novalidate
        >
            <div class="form-block">
                <select
                    id="login-role"
                    class="business-input role-select"
                    required
                >
                    <option value="manager" selected>
                        Login as Manager
                    </option>

                    <option value="owner">
                        Login as Owner
                    </option>

                    <option value="staff">
                        Login as Staff
                    </option>
                </select>

                <label
                    for="login-role"
                    class="select-label"
                >
                    Account Type
                </label>
            </div>

            <div
                class="form-block"
                id="username-block"
            >
                <input
                    type="text"
                    id="username"
                    class="business-input"
                    placeholder=" "
                    required
                    autocomplete="username"
                    maxlength="40"
                >

                <label for="username">
                    Username
                </label>
            </div>

            <div class="form-block">
                <input
                    type="password"
                    id="password"
                    class="business-input"
                    placeholder=" "
                    required
                    autocomplete="current-password"
                >

                <label for="password">
                    Password
                </label>
            </div>

            <div class="access-options">
                <label class="persistence-node">
                    <input
                        type="checkbox"
                        id="remember-station"
                    >

                    Remember Station
                </label>

                <a
                    href="#"
                    class="recovery-anchor"
                    id="forgot-password-link"
                >
                    Forgot Password?
                </a>
            </div>

            <div
                class="error-message"
                id="error-message"
                role="alert"
                aria-live="polite"
            ></div>

            <button
                type="submit"
                class="login-submit-button"
                id="login-btn"
            >
                Sign In as Manager
            </button>
        </form>

        <div
            class="registration-footer"
            id="registration-footer"
        >
            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>
        </div>
    </main>

    <!-- Visual libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        "use strict";

        // --------------------------------------------------
        // FIREBASE CONFIGURATION
        // --------------------------------------------------

        const firebaseConfig = {
            apiKey: "AIzaSyC1eITLVhTB6DbzSKqthVTJdfClRPqtClE",
            authDomain: "business-tracker-3707a.firebaseapp.com",
            projectId: "business-tracker-3707a",
            storageBucket: "business-tracker-3707a.firebasestorage.app",
            messagingSenderId: "650774120895",
            appId: "1:650774120895:web:aa8a4875600caabbf6f90a"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        // --------------------------------------------------
        // DOM REFERENCES
        // --------------------------------------------------

        const loginForm =
            document.getElementById("login-form");

        const loginRoleSelect =
            document.getElementById("login-role");

        const usernameBlock =
            document.getElementById("username-block");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const rememberStationInput =
            document.getElementById("remember-station");

        const forgotPasswordLink =
            document.getElementById("forgot-password-link");

        const loginButton =
            document.getElementById("login-btn");

        const registrationFooter =
            document.getElementById("registration-footer");

        const loginInstructions =
            document.getElementById("login-instructions");

        const errorMessage =
            document.getElementById("error-message");

        /*
         * Prevent the authentication observer from redirecting before
         * the selected role has been validated during form submission.
         */
        let loginSubmissionInProgress = false;

        // --------------------------------------------------
        // GENERAL HELPERS
        // --------------------------------------------------

        function clearLoginError() {
            errorMessage.textContent = "";
            errorMessage.classList.remove("show");
        }

        function showLoginError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add("show");
        }

        function normaliseUsername(value) {
            return String(value || "")
                .trim()
                .toLowerCase();
        }

        function getRoleDisplayName(role) {
            const roleNames = {
                owner: "Owner",
                manager: "Manager",
                staff: "Staff"
            };

            return roleNames[role] || "Unknown";
        }

        function setLoginButtonLabel() {
            const selectedRole = loginRoleSelect.value;

            const labels = {
                owner: "Sign In as Owner",
                manager: "Sign In as Manager",
                staff: "Sign In as Staff"
            };

            loginButton.textContent =
                labels[selectedRole] || "Sign In";
        }

        // --------------------------------------------------
        // ROLE SELECTOR UI
        // --------------------------------------------------

        function updateLoginFormForRole() {
            const selectedRole = loginRoleSelect.value;

            clearLoginError();

            /*
             * Clear the password whenever the account type changes.
             */
            passwordInput.value = "";

            if (selectedRole === "owner") {
                usernameBlock.classList.remove("is-hidden");
                usernameInput.required = true;
                registrationFooter.classList.add("is-hidden");

                loginInstructions.textContent =
                    "Enter your owner username and password";
            } else {
                usernameBlock.classList.remove("is-hidden");
                usernameInput.required = true;

                if (selectedRole === "staff") {
                    registrationFooter.classList.add("is-hidden");

                    loginInstructions.textContent =
                        "Enter the credentials generated by your manager";
                } else {
                    registrationFooter.classList.remove("is-hidden");

                    loginInstructions.textContent =
                        "Enter your manager credentials below";
                }
            }

            setLoginButtonLabel();
        }

        // --------------------------------------------------
        // USER PROFILE AND ROUTING
        // --------------------------------------------------

        async function loadUserProfile(uid) {
            const userDocument = await db
                .collection("users")
                .doc(uid)
                .get();

            if (!userDocument.exists) {
                throw new Error(
                    "Your account profile is missing. " +
                    "Please contact an administrator."
                );
            }

            return userDocument.data();
        }

        function validateUserProfile(userData) {
            if (
                !userData ||
                typeof userData.role !== "string"
            ) {
                throw new Error(
                    "This account does not have a valid role."
                );
            }

            const validRoles = [
                "owner",
                "manager",
                "staff"
            ];

            if (!validRoles.includes(userData.role)) {
                throw new Error(
                    "This account has an unsupported role."
                );
            }

            if (
                (
                    userData.role === "manager" ||
                    userData.role === "staff"
                ) &&
                !userData.hotelId
            ) {
                throw new Error(
                    "This account does not have an assigned hotel."
                );
            }
        }

        async function redirectAuthenticatedUser(userData) {
            validateUserProfile(userData);

            if (userData.role === "owner") {
                window.location.replace(
                    "owner-select-hotel.html"
                );

                return;
            }

            /*
             * Managers and staff use the same manager-side pages.
             *
             * Staff restrictions and hotel scoping will be enforced by
             * the shared auth-permissions.js helper on those pages.
             */
            if (
                userData.role === "manager" ||
                userData.role === "staff"
            ) {
                window.location.replace(
                    "manager-dashboard.html"
                );

                return;
            }

            throw new Error(
                "Unable to determine the correct dashboard."
            );
        }

        // --------------------------------------------------
        // AUTHENTICATION PERSISTENCE
        // --------------------------------------------------

        rememberStationInput.addEventListener(
            "change",
            async () => {
                try {
                    const persistence =
                        rememberStationInput.checked
                            ? firebase.auth.Auth.Persistence.LOCAL
                            : firebase.auth.Auth.Persistence.SESSION;

                    await auth.setPersistence(persistence);
                } catch (error) {
                    console.error(
                        "Unable to update authentication persistence:",
                        error
                    );

                    showLoginError(
                        "Unable to update the remember-me setting."
                    );
                }
            }
        );

        // --------------------------------------------------
        // ROLE SELECTION
        // --------------------------------------------------

        loginRoleSelect.addEventListener(
            "change",
            updateLoginFormForRole
        );

        updateLoginFormForRole();

        // --------------------------------------------------
        // ALREADY SIGNED-IN USER CHECK
        // --------------------------------------------------

        auth.onAuthStateChanged(async (user) => {
            if (
                !user ||
                loginSubmissionInProgress
            ) {
                return;
            }

            try {
                const userData =
                    await loadUserProfile(user.uid);

                validateUserProfile(userData);

                await redirectAuthenticatedUser(userData);
            } catch (error) {
                console.error(
                    "Automatic account verification failed:",
                    error
                );

                try {
                    await auth.signOut();
                } catch (signOutError) {
                    console.error(
                        "Sign-out failed:",
                        signOutError
                    );
                }

                showLoginError(
                    error.message ||
                    "Unable to verify your account."
                );
            }
        });

        // --------------------------------------------------
        // LOGIN SUBMISSION
        // --------------------------------------------------

        loginForm.addEventListener(
            "submit",
            async (event) => {
                event.preventDefault();

                clearLoginError();

                const selectedRole =
                    loginRoleSelect.value;

                const username =
                    normaliseUsername(
                        usernameInput.value
                    );

                const password =
                    passwordInput.value;

                if (!username || !password) {
                    showLoginError(
                        "Please enter your username and password."
                    );

                    return;
                }

                loginSubmissionInProgress = true;
                loginButton.disabled = true;
                loginButton.textContent =
                    "Authenticating...";

                try {
                    const persistence =
                        rememberStationInput.checked
                            ? firebase.auth.Auth.Persistence.LOCAL
                            : firebase.auth.Auth.Persistence.SESSION;

                    await auth.setPersistence(persistence);

                    /*
                     * Keep the existing synthetic Firebase Auth email
                     * mechanism.
                     */
                    const syntheticEmail =
                        `${username}@business.local`;

                    const userCredential =
                        await auth.signInWithEmailAndPassword(
                            syntheticEmail,
                            password
                        );

                    const userData =
                        await loadUserProfile(
                            userCredential.user.uid
                        );

                    validateUserProfile(userData);

                    /*
                     * Reject accounts when the selected login type does
                     * not match the role stored in Firestore.
                     */
                    if (userData.role !== selectedRole) {
                        await auth.signOut();

                        throw new Error(
                            "This account is registered as " +
                            `${getRoleDisplayName(userData.role)}, ` +
                            `not ${getRoleDisplayName(selectedRole)}.`
                        );
                    }

                    await redirectAuthenticatedUser(
                        userData
                    );
                } catch (error) {
                    console.error(
                        "Login failed:",
                        error
                    );

                    let message =
                        error.message ||
                        "Login failed. Please check your credentials.";

                    if (
                        error.code ===
                            "auth/invalid-credential" ||
                        error.code ===
                            "auth/invalid-login-credentials" ||
                        error.code ===
                            "auth/wrong-password" ||
                        error.code ===
                            "auth/user-not-found"
                    ) {
                        message =
                            "Incorrect username or password.";
                    } else if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {
                        message =
                            "Too many failed attempts. " +
                            "Please try again later.";
                    } else if (
                        error.code ===
                        "auth/user-disabled"
                    ) {
                        message =
                            "This account has been disabled.";
                    } else if (
                        error.code ===
                        "auth/network-request-failed"
                    ) {
                        message =
                            "Network error. Please check " +
                            "your internet connection.";
                    } else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {
                        message =
                            "The username format is invalid.";
                    }

                    showLoginError(message);

                    loginSubmissionInProgress = false;
                    loginButton.disabled = false;

                    setLoginButtonLabel();
                }
            }
        );

        // --------------------------------------------------
        // FORGOT PASSWORD PLACEHOLDER
        // --------------------------------------------------

        forgotPasswordLink.addEventListener(
            "click",
            (event) => {
                event.preventDefault();

                const selectedRole =
                    loginRoleSelect.value;

                if (selectedRole === "staff") {
                    showLoginError(
                        "Please contact your manager to reset " +
                        "your staff password."
                    );

                    return;
                }

                showLoginError(
                    "Please contact the system administrator " +
                    "to reset your password."
                );
            }
        );

        // --------------------------------------------------
        // INITIAL LOGIN CARD ANIMATION
        // --------------------------------------------------

        window.addEventListener(
            "DOMContentLoaded",
            () => {
                if (typeof gsap !== "undefined") {
                    gsap.to("#auth-box", {
                        opacity: 1,
                        y: 0,
                        duration: 1.4,
                        ease: "power4.out"
                    });
                } else {
                    const authBox =
                        document.getElementById("auth-box");

                    authBox.style.opacity = "1";
                    authBox.style.transform =
                        "translateY(0)";
                }
            }
        );

        // --------------------------------------------------
        // THREE.JS VISUAL BACKGROUND
        // --------------------------------------------------

        function initialiseVisualBackground() {
            if (
                typeof THREE === "undefined" ||
                typeof gsap === "undefined"
            ) {
                console.warn(
                    "Visual libraries did not load. " +
                    "Authentication remains available."
                );

                return;
            }

            const container =
                document.getElementById(
                    "canvas-container"
                );

            const scene =
                new THREE.Scene();

            scene.fog =
                new THREE.FogExp2(
                    "#0d0d0d",
                    0.15
                );

            const camera =
                new THREE.PerspectiveCamera(
                    55,
                    window.innerWidth /
                        window.innerHeight,
                    0.1,
                    100
                );

            camera.position.z = 7;

            const renderer =
                new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: true,
                    powerPreference:
                        "high-performance"
                });

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.setPixelRatio(
                Math.min(
                    window.devicePixelRatio,
                    2
                )
            );

            container.appendChild(
                renderer.domElement
            );

            const nodeCount = 80;

            const nodeGeometry =
                new THREE.BufferGeometry();

            const nodePositions =
                new Float32Array(
                    nodeCount * 3
                );

            const nodeVelocities = [];

            for (
                let index = 0;
                index < nodeCount * 3;
                index += 3
            ) {
                nodePositions[index] =
                    (Math.random() - 0.5) * 12;

                nodePositions[index + 1] =
                    (Math.random() - 0.5) * 8;

                nodePositions[index + 2] =
                    (Math.random() - 0.5) * 6;

                nodeVelocities.push(
                    new THREE.Vector3(
                        (Math.random() - 0.5) *
                            0.003,
                        (Math.random() - 0.5) *
                            0.003,
                        (Math.random() - 0.5) *
                            0.003
                    )
                );
            }

            nodeGeometry.setAttribute(
                "position",
                new THREE.BufferAttribute(
                    nodePositions,
                    3
                )
            );

            function createNodeTexture() {
                const canvas =
                    document.createElement(
                        "canvas"
                    );

                canvas.width = 16;
                canvas.height = 16;

                const context =
                    canvas.getContext("2d");

                context.beginPath();

                context.arc(
                    8,
                    8,
                    5,
                    0,
                    Math.PI * 2
                );

                context.fillStyle =
                    "#557373";

                context.fill();

                return new THREE.CanvasTexture(
                    canvas
                );
            }

            const nodeMaterial =
                new THREE.PointsMaterial({
                    size: 0.12,
                    map: createNodeTexture(),
                    transparent: true,
                    opacity: 0.6,
                    depthWrite: false
                });

            const nodePointCloud =
                new THREE.Points(
                    nodeGeometry,
                    nodeMaterial
                );

            scene.add(nodePointCloud);

            const lineMaterial =
                new THREE.LineBasicMaterial({
                    color: 0x557373,
                    transparent: true,
                    opacity: 0.08
                });

            const lineMesh =
                new THREE.LineSegments(
                    new THREE.BufferGeometry(),
                    lineMaterial
                );

            scene.add(lineMesh);

            usernameInput.addEventListener(
                "focus",
                () => {
                    gsap.to(nodeMaterial, {
                        size: 0.18,
                        opacity: 0.9,
                        duration: 0.5
                    });

                    gsap.to(lineMaterial, {
                        opacity: 0.2,
                        duration: 0.5
                    });

                    gsap.to(
                        camera.position,
                        {
                            z: 6.2,
                            ease: "power2.out",
                            duration: 1
                        }
                    );
                }
            );

            usernameInput.addEventListener(
                "blur",
                () => {
                    gsap.to(nodeMaterial, {
                        size: 0.12,
                        opacity: 0.6,
                        duration: 0.6
                    });

                    gsap.to(lineMaterial, {
                        opacity: 0.08,
                        duration: 0.6
                    });

                    gsap.to(
                        camera.position,
                        {
                            z: 7,
                            ease: "power2.out",
                            duration: 1
                        }
                    );
                }
            );

            passwordInput.addEventListener(
                "focus",
                () => {
                    gsap.to(nodeMaterial, {
                        size: 0.08,
                        opacity: 0.4,
                        duration: 0.4
                    });

                    gsap.to(lineMaterial, {
                        opacity: 0.15,
                        duration: 0.4
                    });

                    gsap.to(
                        camera.position,
                        {
                            z: 7.8,
                            ease: "power3.out",
                            duration: 0.8
                        }
                    );
                }
            );

            passwordInput.addEventListener(
                "blur",
                () => {
                    gsap.to(nodeMaterial, {
                        size: 0.12,
                        opacity: 0.6,
                        duration: 0.6
                    });

                    gsap.to(lineMaterial, {
                        opacity: 0.08,
                        duration: 0.6
                    });

                    gsap.to(
                        camera.position,
                        {
                            z: 7,
                            ease: "power2.out",
                            duration: 1
                        }
                    );
                }
            );

            let mouseX = 0;
            let mouseY = 0;

            window.addEventListener(
                "mousemove",
                (event) => {
                    mouseX =
                        (
                            event.clientX /
                            window.innerWidth
                        ) * 2 - 1;

                    mouseY =
                        -(
                            event.clientY /
                            window.innerHeight
                        ) * 2 + 1;

                    gsap.to("#auth-box", {
                        rotationY: mouseX * 5,
                        rotationX: -mouseY * 5,
                        duration: 0.5,
                        ease: "power1.out"
                    });
                }
            );

            function animate() {
                window.requestAnimationFrame(
                    animate
                );

                const positions =
                    nodePointCloud
                        .geometry
                        .attributes
                        .position
                        .array;

                const linePositions = [];

                for (
                    let index = 0;
                    index < nodeCount;
                    index += 1
                ) {
                    const positionIndex =
                        index * 3;

                    positions[positionIndex] +=
                        nodeVelocities[index].x;

                    positions[positionIndex + 1] +=
                        nodeVelocities[index].y;

                    positions[positionIndex + 2] +=
                        nodeVelocities[index].z;

                    if (
                        Math.abs(
                            positions[positionIndex]
                        ) > 6
                    ) {
                        nodeVelocities[index].x *= -1;
                    }

                    if (
                        Math.abs(
                            positions[
                                positionIndex + 1
                            ]
                        ) > 4
                    ) {
                        nodeVelocities[index].y *= -1;
                    }

                    if (
                        Math.abs(
                            positions[
                                positionIndex + 2
                            ]
                        ) > 3
                    ) {
                        nodeVelocities[index].z *= -1;
                    }

                    for (
                        let comparisonIndex =
                            index + 1;
                        comparisonIndex <
                            nodeCount;
                        comparisonIndex += 1
                    ) {
                        const comparisonPositionIndex =
                            comparisonIndex * 3;

                        const differenceX =
                            positions[positionIndex] -
                            positions[
                                comparisonPositionIndex
                            ];

                        const differenceY =
                            positions[
                                positionIndex + 1
                            ] -
                            positions[
                                comparisonPositionIndex +
                                1
                            ];

                        const differenceZ =
                            positions[
                                positionIndex + 2
                            ] -
                            positions[
                                comparisonPositionIndex +
                                2
                            ];

                        const distance =
                            Math.sqrt(
                                (
                                    differenceX *
                                    differenceX
                                ) +
                                (
                                    differenceY *
                                    differenceY
                                ) +
                                (
                                    differenceZ *
                                    differenceZ
                                )
                            );

                        if (distance < 2.5) {
                            linePositions.push(
                                positions[
                                    positionIndex
                                ],
                                positions[
                                    positionIndex + 1
                                ],
                                positions[
                                    positionIndex + 2
                                ],
                                positions[
                                    comparisonPositionIndex
                                ],
                                positions[
                                    comparisonPositionIndex +
                                    1
                                ],
                                positions[
                                    comparisonPositionIndex +
                                    2
                                ]
                            );
                        }
                    }
                }

                nodePointCloud
                    .geometry
                    .attributes
                    .position
                    .needsUpdate = true;

                lineMesh.geometry.setAttribute(
                    "position",
                    new THREE.BufferAttribute(
                        new Float32Array(
                            linePositions
                        ),
                        3
                    )
                );

                if (linePositions.length > 0) {
                    lineMesh.geometry
                        .computeBoundingSphere();
                }

                nodePointCloud.rotation.y +=
                    0.001;

                lineMesh.rotation.y +=
                    0.001;

                camera.position.x +=
                    (
                        mouseX * 0.4 -
                        camera.position.x
                    ) * 0.05;

                camera.position.y +=
                    (
                        mouseY * 0.4 -
                        camera.position.y
                    ) * 0.05;

                renderer.render(
                    scene,
                    camera
                );
            }

            animate();

            window.addEventListener(
                "resize",
                () => {
                    camera.aspect =
                        window.innerWidth /
                        window.innerHeight;

                    camera.updateProjectionMatrix();

                    renderer.setSize(
                        window.innerWidth,
                        window.innerHeight
                    );
                }
            );
        }

        initialiseVisualBackground();
    </script>
</body>
</html>
